<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SplitWisee · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7faf8;
        color: #182c26;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #14221e;
          color: #e6f0e9;
        }
        section {
          background: #1c2e27 !important;
          border-color: #30473b !important;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      section {
        max-width: 420px;
        padding: 32px;
        border: 1px solid #e8eee9;
        border-radius: 18px;
        background: #fff;
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.6;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #147d64;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>You’re offline.</h1>
      <p>Reconnect to see your household and save receipts. Nothing on your account has changed.</p>
      <a href="/">Try again</a>
    </section>
  </body>
</html>
